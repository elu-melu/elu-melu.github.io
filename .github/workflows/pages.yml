name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # Set by the external cron (see scripts/SPOTIFY.md): only deploy when the
      # tracks changed. A manual run leaves it off and always deploys.
      spotify_only:
        type: boolean
        default: false
  # Disabled for now; re-enable by uncommenting.
  # Backup refresh. GitHub runs these late or skips them, which is why an
  # external cron also calls workflow_dispatch with spotify_only.
  # Scheduled runs only deploy when the tracks have changed.
  # schedule:
  #   - cron: "*/5 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.changed.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
      - id: pages
        uses: actions/configure-pages@v6
      - run: bun install --frozen-lockfile
      # Bun installs dependencies; the build itself runs on Node 22 (.nvmrc).
      # site and base come from Pages, so the same build works at
      # elu-melu.github.io or, later, at a custom domain.
      - run: node --version
      - name: Fetch recently played from Spotify
        run: node scripts/fetch-spotify.mjs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Skip the deploy if nothing changed
        id: changed
        run: |
          live=$(curl -sf "${{ steps.pages.outputs.base_url }}/spotify.json" | jq -c '[.tracks[].id]' || echo none)
          new=$(jq -c '[.tracks[].id]' src/data/spotify.json)
          refresh_only="${{ github.event_name == 'schedule' || inputs.spotify_only == true }}"
          if [ "$refresh_only" = "true" ] && [ "$live" = "$new" ]; then
            echo "Spotify: no new tracks, skipping the deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.skip != 'true'
        run: npx --no-install astro build --site "${{ steps.pages.outputs.origin }}" --base "${{ steps.pages.outputs.base_path }}/"
      - if: steps.changed.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
