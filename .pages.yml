media: public/uploads
content:
  - name: notes
    label: Log
    type: collection
    path: src/content/notes
    exclude: ["_example.md"]
    format: yaml-frontmatter
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: type
        label: Type
        type: select
        required: true
        options: [build, research, edit, read, watch, place, thought]
      - name: date
        label: Date
        type: date
        required: true
      - name: note
        label: Note
        type: text
        required: true
      - name: link
        label: Link
        type: string
      - name: linkLabel
        label: Link label
        type: string
      - name: image
        label: Image
        type: image
